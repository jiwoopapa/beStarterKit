# ─── Prod 프로필 (환경변수 기반 DB 연결) ──────────
spring:
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
